[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bifrost-market-data"
version = "0.9.5"
description = "Bifrost Market Data Subcontractor — Polygon.io ingestion into raw_market.* / ops_jobs.* schemas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "psycopg2-binary>=2.9",
  "pyyaml>=6.0",
  "redis>=5.0",
  "uvicorn[standard]>=0.32",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[project.scripts]
market-data-worker = "bifrost_market_data.worker.runner:main"
market-data-schedule = "bifrost_market_data.scheduler.daily:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
