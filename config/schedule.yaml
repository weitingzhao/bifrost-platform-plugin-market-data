# Market-data scheduler slots (CronJob → CLI --slot).
# Cron strings are informational; K8s CronJob YAML is the runtime schedule source.

scheduler:
  # Watchlist source: "db" (default) queries local PG, "platform-api" fetches
  # the union of all Trade environments' watchlists from Platform API.
  watchlist_source: platform-api
  platform_api_url: http://platform-api.bifrost-platform-prod.svc.cluster.local:8780
  watchlist_query: >-
    SELECT DISTINCT symbol FROM public.watchlist
    WHERE sec_type = 'STK' AND optionable = true
      AND symbol IS NOT NULL AND trim(symbol) <> ''
  # Optional hard-coded override (skips DB query when set):
  # watchlist_symbols: [AAPL, MSFT, TSLA]
  # Wave A IV Radar: unioned into eod-pipeline and option-refresh
  # (always included in the refresh batch). Analytics upserts moved to Research.
  # SPX = index options (Polygon dual-ticker: snapshot I:SPX, contracts SPX).
  iv_radar_benchmarks: [SPY, QQQ, IWM, SPX, AAPL, MSFT, GOOG, AMZN, META, NVDA, TSLA]
  # Explicit index-option roots (optional; inferred from benchmarks when omitted).
  # index_option_underlyings: [SPX]

  slots:
    stock-eod:
      # Align with Dagster market_universe_calendar (22:00 UTC ≈ 17:00 America/Chicago).
      cron: "0 22 * * *"
      priority: 5
    eod-pipeline:
      cron: "0 22 * * *"
      priority: 5
    universe-daily:
      cron: "0 22 * * *"
      priority: 3
    corporate:
      cron: "0 23 * * *"
      priority: 2
      # Whole market by ex-date window, not per watchlist symbol.
      lookback_days: 7
      lookahead_days: 60
    option-refresh:
      cron: "20 */6 * * *"
      priority: 4
      batch_size: 12
    option-bars:
      cron: "45 22 * * *"
      priority: 4
      # At-the-money: next 3 expiries × ±10 strikes per right, per underlying.
      expiries: 3
      strikes_each_side: 10
    # option-trades retired 0.10.3: option trades are not in Options Starter.
    minute-bars:
      cron: "15 23 * * *"
      priority: 3
      expiries: 2
      strikes_each_side: 5
      batch_size: 80
    calendar:
      cron: "0 22 * * *"
      priority: 1
    reference:
      cron: "30 21 * * *"
      priority: 2
    fundamentals-rotate:
      cron: "0 3 * * *"
      priority: 1
      # CS common-stock universe (same as Stock Screener). Catch-up prefers
      # names missing income_statement; financials-only keeps Polygon budget
      # on the screener path (ratios/short remain optional).
      universe: cs
      prioritize_missing: true
      batch_size: 5000
      include_ratios: false
      include_short_interest: false
      include_short_volume: false
    related-rotate:
      cron: "30 22 * * *"
      priority: 1
      batch_size: 40
    trim:
      cron: "15 2 * * *"
      keep_days: 7
      keep_max: 40000  # ~7 days at 5000 financials/day; adherence evidence must outlive the trim
      option_trades_keep_days: 30
    # Wave 14G-A: readiness-refresh retired (stock_readiness_daily dropped).
    stock-snapshot:
      cron: "5 21 * * *"
      priority: 4
    stock-movers:
      cron: "10 21 * * *"
      priority: 4
    fundamentals-market:
      # Ratios + short volume for the last completed session, short interest
      # for the latest settlement; whole market at 1,000 rows a page.
      cron: "30 4 * * 2-6"
      priority: 2
      short_interest_lookback_days: 45

    oi-gap-heal:
      # D6=B: weekly re-scan recent days; DB-to-DB extract fills OI gaps
      cron: "0 4 * * 6"
      lookback_days: 30
    # Wave 2.1: max-pain / atm-iv-pcr / iv-percentile moved to Research NS
    # (bifrost_research.scheduler.volatility). Plugin no longer schedules these.
