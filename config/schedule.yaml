# Market-data scheduler slots (CronJob → CLI --slot).
# Cron strings are informational; K8s CronJob YAML is the runtime schedule source.

scheduler:
  # Watchlist source: "db" (default) queries local PG, "platform-api" fetches
  # the union of all Trade environments' watchlists from Platform API.
  watchlist_source: platform-api
  platform_api_url: http://platform-api.bifrost-platform-prod.svc.cluster.local:8780
  watchlist_query: >-
    SELECT DISTINCT symbol FROM public.watchlist
    WHERE sec_type = 'STK' AND optionable = true
      AND symbol IS NOT NULL AND trim(symbol) <> ''
  # Optional hard-coded override (skips DB query when set):
  # watchlist_symbols: [AAPL, MSFT, TSLA]
  # Wave A IV Radar: unioned into eod-pipeline and option-refresh
  # (always included in the refresh batch). Analytics upserts moved to Research.
  # SPX = index options (Polygon dual-ticker: snapshot I:SPX, contracts SPX).
  iv_radar_benchmarks: [SPY, QQQ, IWM, SPX, AAPL, MSFT, GOOG, AMZN, META, NVDA, TSLA]
  # Explicit index-option roots (optional; inferred from benchmarks when omitted).
  # index_option_underlyings: [SPX]

  slots:
    stock-eod:
      # Align with Dagster market_universe_calendar (22:00 UTC ≈ 17:00 America/Chicago).
      cron: "0 22 * * *"
      priority: 5
    eod-pipeline:
      cron: "0 22 * * *"
      priority: 5
      # Blueprint C-F5: snapshot research.option_universe. Resident names whole;
      # core and edge get the near-the-money window (next `expiries` expiries,
      # strikes within ±strike_pct of spot) — a whole chain at 575 names is
      # ~130 GB of 90-session retention, the window about 18 GB.
      universe: research
      expiries: 3
      strike_pct: 0.15
    universe-daily:
      cron: "0 22 * * *"
      priority: 3
    corporate:
      cron: "0 23 * * *"
      priority: 2
      # Whole market by ex-date window, not per watchlist symbol.
      lookback_days: 7
      lookahead_days: 60
    option-refresh:
      cron: "20 */6 * * *"
      priority: 4
      # One full cycle a day: four six-hourly runs x 144 covers the ~564
      # non-benchmark names in the universe. It was 12, and because the
      # rotation hashed the target date all four runs took the same twelve,
      # so the catalogue came round about every 48 days. option-bars picks
      # its near-spot tickers out of that catalogue, so a stale one narrows
      # what gets priced.
      batch_size: 144
      # Blueprint C-F5: enumerate research.option_universe (resident / core /
      # edge), not the watchlist. Names the table lists but nothing has
      # enumerated go first, up to this many per run; the table's tier sets
      # the priority. Empty table → the watchlist, so the slot never stalls.
      universe: research
      max_new_per_run: 150
    option-bars:
      cron: "45 22 * * *"
      priority: 4
      # At-the-money: next 3 expiries × ±10 strikes per right, per underlying.
      expiries: 3
      strikes_each_side: 10
      # Renews the same 575 underlyings the P4 backfill bought history for;
      # the watchlist stays the fallback when research.option_universe is empty.
      universe: research
    # option-trades retired 0.10.3: option trades are not in Options Starter.
    minute-bars:
      cron: "15 23 * * *"
      priority: 3
      expiries: 2
      strikes_each_side: 5
      batch_size: 80
    calendar:
      cron: "0 22 * * *"
      priority: 1
    reference:
      cron: "30 21 * * *"
      priority: 2
    fundamentals-rotate:
      cron: "0 3 * * *"
      priority: 1
      # CS common-stock universe (same as Stock Screener). Catch-up prefers
      # names missing income_statement; financials-only keeps Polygon budget
      # on the screener path (ratios/short remain optional).
      universe: cs
      prioritize_missing: true
      batch_size: 5000
      include_ratios: false
      include_short_interest: false
      include_short_volume: false
    related-rotate:
      cron: "30 22 * * *"
      priority: 1
      batch_size: 40
    trim:
      cron: "15 2 * * *"
      # Retention is a window, so how far back the queue can be questioned does
      # not depend on how busy it was. Slot adherence looks back about 30 hours.
      keep_hours: 48
      # Backstop only, not a policy: a runaway producer must not grow the table
      # without bound between two trims.
      keep_max: 5000000
      # No gateway in front of the CLI Dagster fires; a backfill day can leave
      # millions of rows and one nightly run should clear them.
      budget_sec: 240
      # The job rows are a work queue, not a record. ops_jobs.queue_sample keeps
      # the throughput series once they are gone.
      queue_sample_keep_days: 90
      option_trades_keep_days: 30
      # One observation per session, so retention is counted in sessions.
      option_snapshot_keep_sessions: 90
      # Intraday rows leave at about 1,550 a second (the New York time-of-day has
      # to be evaluated per row); a session writes ~345,000 of them across its
      # three fires, so one nightly run needs about four minutes to keep up.
      snapshot_budget_sec: 300
      option_snapshot_intraday_keep_days: 30
    # Wave 14G-A: readiness-refresh retired (stock_readiness_daily dropped).
    stock-snapshot:
      cron: "5 21 * * *"
      priority: 4
    stock-movers:
      cron: "10 21 * * *"
      priority: 4
    intraday-chain:
      # Dagster fires this three times a NY session (10:30 / 13:00 / 15:30 ET);
      # the cron here is the first fire, for dashboard display only.
      cron: "30 14 * * 1-5"
      priority: 3
    ticker-details:
      # /v3/reference/tickers/{ticker} only. The list endpoint does not carry
      # list_date / sector / market_cap / description, which is why they are
      # null for all 5,317 active tickers. 200 a day drains the backlog in about
      # four weeks and then keeps refreshing the stalest.
      cron: "30 3 * * *"
      priority: 1
      batch_size: 200
    treasury:
      # Twice, because the vendor's publication hour could not be measured.
      # Measured 2026-09-11: our newest was 2026-09-08 while Polygon already had
      # 09-09, so the 12:00 run had preceded its arrival — and `fetched_at` is a
      # last-write column (the 30-day lookback rewrites the whole window), so
      # when a row *first* became available is not recoverable from history.
      # A second late-day poll costs one page of twenty rows and removes the
      # need to guess the hour right.
      cron: "0 12,23 * * 1-5"
      priority: 2
      lookback_days: 30
    option-backfill:
      # Manual / one-off: 24 expiry months per underlying, strike within +-30%
      # of spot, at most 90 days of life priced per contract.
      # No cron: this is an Owner-run one-off, so the dashboard must not
      # score it for adherence. Fire it with POST /market/ingest/enqueue-slot.
      priority: 1
      months: 24
      # Per-row history from research.option_universe (12 for edge, 24 otherwise).
      universe: research
      strike_pct: 0.30
      dte: 90
    fundamentals-market:
      # Ratios + short volume for the last completed session, short interest
      # for the latest settlement; whole market at 1,000 rows a page.
      cron: "30 4 * * 2-6"
      priority: 2
      short_interest_lookback_days: 45
      # 120 pages truncated the 2026-09-09 pull mid-market and the job
      # correctly failed; short_interest then fell 27 days behind.
      short_interest_max_pages: 400
    # Wave 2.1: max-pain / atm-iv-pcr / iv-percentile moved to Research NS
    # (bifrost_research.scheduler.volatility). Plugin no longer schedules these.
