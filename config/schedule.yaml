# Market-data scheduler slots (CronJob → CLI --slot).
# Cron strings are informational; K8s CronJob YAML is the runtime schedule source.

scheduler:
  # Watchlist source: "db" (default) queries local PG, "platform-api" fetches
  # the union of all Trade environments' watchlists from Platform API.
  watchlist_source: platform-api
  platform_api_url: http://platform-api.bifrost-platform-prod.svc.cluster.local:8780
  watchlist_query: >-
    SELECT DISTINCT symbol FROM public.watchlist
    WHERE sec_type = 'STK' AND optionable = true
      AND symbol IS NOT NULL AND trim(symbol) <> ''
  # Optional hard-coded override (skips DB query when set):
  # watchlist_symbols: [AAPL, MSFT, TSLA]
  # Wave A IV Radar: unioned into atm-iv-pcr, iv-percentile, eod-pipeline,
  # and option-refresh (always included in the refresh batch). Not global watchlist_query.
  iv_radar_benchmarks: [SPY, QQQ, IWM]

  slots:
    stock-eod:
      cron: "30 21 * * *"
      priority: 5
    eod-pipeline:
      cron: "0 22 * * *"
      priority: 5
    universe-daily:
      cron: "0 22 * * *"
      priority: 3
    corporate:
      cron: "0 23 * * *"
      priority: 2
    option-refresh:
      cron: "20 */6 * * *"
      priority: 4
      batch_size: 12
    option-bars:
      cron: "45 22 * * *"
      priority: 4
      expiry_days: 60
      max_per_underlying: 40
    minute-bars:
      cron: "15 23 * * *"
      priority: 3
      expiry_days: 45
      max_per_underlying: 10
      batch_size: 80
    calendar:
      cron: "0 22 * * *"
      priority: 1
    reference:
      cron: "30 21 * * *"
      priority: 2
    fundamentals-rotate:
      cron: "0 3 * * *"
      priority: 1
      batch_size: 40
    trim:
      cron: "15 2 * * *"
      keep_days: 7
      keep_max: 5000
    readiness-refresh:
      cron: "30 23 * * *"
      priority: 0
    stock-snapshot:
      cron: "5 21 * * *"
      priority: 4
    stock-movers:
      cron: "10 21 * * *"
      priority: 4
    oi-gap-heal:
      # D6=B: weekly re-scan recent days; DB-to-DB extract fills OI gaps
      cron: "0 4 * * 6"
      lookback_days: 14
    max-pain:
      # D8=B: daily Max Pain from OI; lookback heals holiday/gap days
      cron: "45 22 * * *"
      lookback_days: 3
    atm-iv-pcr:
      # D12=A: merged ATM IV + PCR at 23:00 UTC
      cron: "0 23 * * *"
      lookback_days: 3
    iv-percentile:
      # D12=A: after atm-iv-pcr; depends on atm_iv_daily
      cron: "15 23 * * *"
      lookback_days: 3
      percentile_window: 252
