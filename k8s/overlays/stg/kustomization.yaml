# STG seat — independent namespace (Owner decision 2026-07-30).
#
# Does NOT touch live DEV workers in plugin-market-data.
#
# Preview: kubectl kustomize k8s/overlays/stg
# Apply:   kubectl apply -k k8s/overlays/stg
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: plugin-market-data-stg

resources:
  - ../../base

patches:
  - path: configmap-patch.yaml
  - path: replicas-patch.yaml

images:
  - name: bifrost-market-data
    newTag: "0.1.1"
