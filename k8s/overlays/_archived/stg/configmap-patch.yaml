apiVersion: v1
kind: ConfigMap
metadata:
  name: market-data-config
data:
  mode: live
  tier: starter
  poll_interval_sec: "5"
  market-data.yaml: |
    polygon:
      api_key: ""
      tier: starter
      rest_base: https://api.polygon.io
    postgres:
      host: bifrost-postgres-rw.data.svc.cluster.local
      port: 5432
      dbname: bifrost_stg
      user: bifrost
      password: ""
    redis:
      # STG redis-queue (adjust if STG seat uses a dedicated redis)
      url: redis://redis-queue-stg.data.svc.cluster.local:6379/0
    worker:
      pool: stocks
      concurrency: 4
      poll_interval_sec: 5
