# Readiness refresh — RETIRED (stock_readiness_daily dropped from Trade DB).
# Suspended permanently: SEPA readiness is dw_stock.mart_sepa_* via dbt CronJob.
# Do NOT unsuspend — see stock-readiness-retire program D-SRD3.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: market-data-readiness-refresh
  namespace: plugin-market-data
  labels:
    app.kubernetes.io/name: market-data-readiness-refresh
    app.kubernetes.io/part-of: bifrost-market-data
    bifrost.market-data/slot: readiness-refresh
spec:
  schedule: "30 23 * * *"
  timeZone: UTC
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: market-data-readiness-refresh
            app.kubernetes.io/part-of: bifrost-market-data
            bifrost.market-data/slot: readiness-refresh
        spec:
          restartPolicy: Never
          containers:
            - name: scheduler
              image: bifrost-market-data:0.1.1
              imagePullPolicy: IfNotPresent
              args:
                - python
                - -m
                - bifrost_market_data.scheduler.daily
                - --slot
                - readiness-refresh
              env:
                - name: MARKET_DATA_CONFIG
                  value: /config/market-data.yaml
                - name: SCHEDULE_CONFIG
                  value: /config/schedule.yaml
                - name: POSTGRES_HOST
                  valueFrom:
                    secretKeyRef:
                      name: market-data-secrets
                      key: postgres-host
                      optional: true
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: market-data-secrets
                      key: postgres-password
                      optional: true
              volumeMounts:
                - name: config
                  mountPath: /config/market-data.yaml
                  subPath: market-data.yaml
                  readOnly: true
                - name: schedule
                  mountPath: /config/schedule.yaml
                  subPath: schedule.yaml
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: config
              configMap:
                name: market-data-config
            - name: schedule
              configMap:
                name: market-data-schedule
