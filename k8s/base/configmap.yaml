apiVersion: v1
kind: ConfigMap
metadata:
  name: market-data-config
  labels:
    app.kubernetes.io/name: market-data
data:
  mode: live
  tier: starter
  poll_interval_sec: "5"
  market-data.yaml: |
    polygon:
      api_key: ""
      # Paid Starter (Stocks + Options): unlimited calls at the vendor. The
      # tier profile is a soft per-process ceiling; rate_per_sec / burst tune it.
      tier: starter
      rate_per_sec: 8
      burst: 16
      rest_base: https://api.polygon.io
    postgres:
      host: bifrost-postgres-rw.data.svc.cluster.local
      port: 5432
      dbname: bifrost_golden_source
      user: bifrost
      password: ""
    redis:
      url: redis://redis-dev.data.svc.cluster.local:6379/0
    polygon_ws:
      ws_url: wss://socket.polygon.io/options
      tier: starter
      ws_enabled: false
      trades_enabled: false
    redis_massive:
      host: redis-massive
      port: 6379
      db: 0
    watchlist_pg:
      host: bifrost-postgres-rw.data.svc.cluster.local
      port: 5432
      dbname: bifrost_dev
      user: data_writer
      password: ""
    worker:
      pool: stocks
      concurrency: 8
      poll_interval_sec: 5
      # With the 5/min self-throttle gone an SPX chain (115 pages) takes about a
      # minute; 1200s leaves room for vendor slowness without hiding a hang.
      job_timeout_sec: 1200
      stale_running_sec: 1800
