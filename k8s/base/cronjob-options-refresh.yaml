apiVersion: batch/v1
kind: CronJob
metadata:
  name: market-data-option-refresh
  namespace: plugin-market-data
  labels:
    app.kubernetes.io/name: market-data-option-refresh
    app.kubernetes.io/part-of: bifrost-market-data
    bifrost.market-data/slot: option-refresh
spec:
  schedule: "20 */6 * * *"
  timeZone: UTC
  # Suspended: Dagster multi-schedule owns this slot
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Completed Jobs leave on a clock, not only when the next one pushes them
      # out. `successfulJobsHistoryLimit: 3` above only prunes relative to newer
      # runs of the same CronJob, so a CronJob that stops running freezes its
      # last three forever: these have all been suspended since 2026-08-29
      # (Dagster owns the batch) and their frozen history was still pinning
      # `bifrost-market-data:0.9.0` in the registry 29 days later, which is what
      # made those image tags undeletable. Seven days.
      ttlSecondsAfterFinished: 604800
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: market-data-option-refresh
            app.kubernetes.io/part-of: bifrost-market-data
            bifrost.market-data/slot: option-refresh
        spec:
          restartPolicy: Never
          containers:
            - name: scheduler
              image: bifrost-market-data:0.1.0
              imagePullPolicy: IfNotPresent
              args:
                - python
                - -m
                - bifrost_market_data.scheduler.daily
                - --slot
                - option-refresh
              env:
                - name: MARKET_DATA_CONFIG
                  value: /config/market-data.yaml
                - name: SCHEDULE_CONFIG
                  value: /config/schedule.yaml
                - name: POSTGRES_HOST
                  valueFrom:
                    secretKeyRef:
                      name: market-data-secrets
                      key: postgres-host
                      optional: true
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: market-data-secrets
                      key: postgres-password
                      optional: true
              volumeMounts:
                - name: config
                  mountPath: /config/market-data.yaml
                  subPath: market-data.yaml
                  readOnly: true
                - name: schedule
                  mountPath: /config/schedule.yaml
                  subPath: schedule.yaml
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: config
              configMap:
                name: market-data-config
            - name: schedule
              configMap:
                name: market-data-schedule
