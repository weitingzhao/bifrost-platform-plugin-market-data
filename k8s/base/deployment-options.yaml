apiVersion: apps/v1
kind: Deployment
metadata:
  name: polygon-worker-options
  labels:
    app.kubernetes.io/name: polygon-worker-options
    bifrost.market-data/pool: options
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: polygon-worker-options
  template:
    metadata:
      labels:
        app.kubernetes.io/name: polygon-worker-options
        bifrost.market-data/pool: options
        app.kubernetes.io/part-of: bifrost-market-data
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: bifrost-market-data:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["python", "scripts/run_worker.py", "--pool", "options"]
          env:
            - name: MARKET_DATA_CONFIG
              value: /config/market-data.yaml
            - name: WORKER_POOL
              value: options
            - name: POLYGON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: market-data-secrets
                  key: polygon-api-key
                  optional: true
          ports:
            - name: health
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config/market-data.yaml
              subPath: market-data.yaml
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: market-data-config
