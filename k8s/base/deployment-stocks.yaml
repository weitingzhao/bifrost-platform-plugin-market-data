apiVersion: apps/v1
kind: Deployment
metadata:
  name: polygon-worker-stocks
  labels:
    app.kubernetes.io/name: polygon-worker-stocks
    bifrost.market-data/pool: stocks
  annotations:
    bifrost.dev/session: "true"
    bifrost.dev/session-name: polygon-worker-stocks
    bifrost.dev/session-label: Market Data Stocks
    bifrost.dev/session-group: market-data
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: polygon-worker-stocks
  template:
    metadata:
      labels:
        app.kubernetes.io/name: polygon-worker-stocks
        bifrost.market-data/pool: stocks
        app.kubernetes.io/part-of: bifrost-market-data
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: bifrost-market-data:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["python", "scripts/run_worker.py", "--pool", "stocks"]
          env:
            - name: MARKET_DATA_CONFIG
              value: /config/market-data.yaml
            - name: WORKER_POOL
              value: stocks
            - name: POLYGON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: market-data-secrets
                  key: polygon-api-key
                  optional: true
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: market-data-secrets
                  key: postgres-host
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: market-data-secrets
                  key: postgres-password
                  optional: true
          ports:
            - name: health
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config/market-data.yaml
              subPath: market-data.yaml
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: config
          configMap:
            name: market-data-config
