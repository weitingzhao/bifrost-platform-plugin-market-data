apiVersion: v1
kind: ConfigMap
metadata:
  name: market-data-schedule
  namespace: plugin-market-data
  labels:
    app.kubernetes.io/name: market-data
data:
  # This is the runtime copy. `config/schedule.yaml` in the repo holds the same
  # block for local runs and tests; the two are edited together, and a drift
  # between them is a slot behaving differently in the cluster than it reads.
  schedule.yaml: |
    scheduler:
      watchlist_source: platform-api
      platform_api_url: http://platform-api.bifrost-platform-prod.svc.cluster.local:8780
      watchlist_query: >-
        SELECT DISTINCT symbol FROM public.watchlist
        WHERE sec_type = 'STK' AND optionable = true
          AND symbol IS NOT NULL AND trim(symbol) <> ''
      # IV Radar / SEPA benchmark universe: ETFs + SPX + M7 mega-caps.
      # eod-pipeline / option_snapshot / option_open_interest / atm-iv-pcr /
      # iv-percentile all union this with the watchlist.
      iv_radar_benchmarks: [SPY, QQQ, IWM, SPX, AAPL, MSFT, GOOG, AMZN, META, NVDA, TSLA]
      slots:
        stock-eod:
          # Align with Dagster market_universe_calendar @ 22:00 UTC (~17:00 America/Chicago).
          cron: "0 22 * * *"
          priority: 5
        eod-pipeline:
          cron: "0 22 * * *"
          priority: 5
          # Blueprint C-F5: snapshot research.option_universe. Resident names whole;
          # core and edge get the near-the-money window (next `expiries` expiries,
          # strikes within ±strike_pct of spot) — a whole chain at 575 names is
          # ~130 GB of 90-session retention, the window about 18 GB.
          universe: research
          expiries: 3
          strike_pct: 0.15
        universe-daily:
          cron: "0 22 * * *"
          priority: 3
        corporate:
          cron: "0 23 * * *"
          priority: 2
          # Whole market by ex-date window, not per watchlist symbol.
          lookback_days: 7
          lookahead_days: 60
        option-refresh:
          cron: "20 */6 * * *"
          priority: 4
          batch_size: 12
          # Blueprint C-F5: enumerate research.option_universe (resident / core /
          # edge), not the watchlist. Names the table lists but nothing has
          # enumerated go first, up to this many per run; the table's tier sets
          # the priority. Empty table → the watchlist, so the slot never stalls.
          universe: research
          max_new_per_run: 150
        option-bars:
          cron: "45 22 * * *"
          priority: 4
          # At-the-money: next 3 expiries × ±10 strikes per right, per underlying.
          expiries: 3
          strikes_each_side: 10
          # Renews the same 575 underlyings the P4 backfill bought history for;
          # the watchlist stays the fallback when research.option_universe is empty.
          universe: research
        # option-trades retired 0.10.3: option trades are not in Options Starter.
        minute-bars:
          cron: "15 23 * * *"
          priority: 3
          expiries: 2
          strikes_each_side: 5
          batch_size: 80
        calendar:
          cron: "0 22 * * *"
          priority: 1
        reference:
          cron: "30 21 * * *"
          priority: 2
        fundamentals-rotate:
          cron: "0 3 * * *"
          priority: 1
          universe: cs
          prioritize_missing: true
          batch_size: 5000
          include_ratios: false
          include_short_interest: false
          include_short_volume: false
        related-rotate:
          cron: "30 22 * * *"
          priority: 1
          batch_size: 40
        trim:
          cron: "15 2 * * *"
          # Retention is a window, so how far back the queue can be questioned
          # does not depend on how busy it was. Slot adherence looks back ~30h.
          keep_hours: 48
          # Backstop only, not a policy: a runaway producer must not grow the
          # table without bound between two trims.
          keep_max: 5000000
          # No gateway in front of the CLI Dagster fires; a backfill day can
          # leave millions of rows and one nightly run should clear them.
          budget_sec: 240
          # The job rows are a work queue, not a record. ops_jobs.queue_sample
          # keeps the throughput series once they are gone.
          queue_sample_keep_days: 90
          option_trades_keep_days: 30
          # One observation per session, so retention is counted in sessions.
          option_snapshot_keep_sessions: 90
          # Intraday rows leave at about 1,550 a second (the New York time-of-day has
          # to be evaluated per row); a session writes ~345,000 of them across its
          # three fires, so one nightly run needs about four minutes to keep up.
          snapshot_budget_sec: 300
          option_snapshot_intraday_keep_days: 30
        stock-snapshot:
          cron: "5 21 * * *"
          priority: 4
        stock-movers:
          cron: "10 21 * * *"
          priority: 4
        intraday-chain:
          # Dagster fires this three times a NY session (10:30 / 13:00 / 15:30 ET);
          # the cron here is the first fire, for dashboard display only.
          cron: "30 14 * * 1-5"
          priority: 3
        treasury:
          cron: "0 12 * * 1-5"
          priority: 2
          lookback_days: 30
        option-backfill:
          # Manual / one-off: 24 expiry months per underlying, strike within +-30%
          # of spot, at most 90 days of life priced per contract.
          # No cron: this is an Owner-run one-off, so the dashboard must not
          # score it for adherence. Fire it with POST /market/ingest/enqueue-slot.
          priority: 1
          months: 24
          # Per-row history from research.option_universe (12 for edge, 24 otherwise).
          universe: research
          strike_pct: 0.30
          dte: 90
        fundamentals-market:
          # Ratios + short volume for the last completed session, short interest
          # for the latest settlement; whole market at 1,000 rows a page.
          cron: "30 4 * * 2-6"
          priority: 2
          short_interest_lookback_days: 45
          # 120 pages truncated the 2026-09-09 pull mid-market and the job
          # correctly failed; short_interest then fell 27 days behind.
          short_interest_max_pages: 400
        # Wave 2.1: max-pain / atm-iv-pcr / iv-percentile moved to Research NS
        # (bifrost_research.scheduler.volatility). Plugin CronJobs deleted.
        # Wave 14G-A: readiness-refresh slot + CronJob retired (stock_readiness_daily gone).
