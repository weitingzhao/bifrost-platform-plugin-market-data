apiVersion: v1
kind: ConfigMap
metadata:
  name: market-data-schedule
  namespace: plugin-market-data
  labels:
    app.kubernetes.io/name: market-data
data:
  schedule.yaml: |
    scheduler:
      watchlist_source: platform-api
      platform_api_url: http://platform-api.bifrost-platform-prod.svc.cluster.local:8780
      watchlist_query: >-
        SELECT DISTINCT symbol FROM public.watchlist
        WHERE sec_type = 'STK' AND optionable = true
          AND symbol IS NOT NULL AND trim(symbol) <> ''
      # IV Radar / SEPA benchmark universe: ETFs + SPX + M7 mega-caps.
      # eod-pipeline / option_snapshot / option_open_interest / atm-iv-pcr /
      # iv-percentile all union this with the watchlist.
      iv_radar_benchmarks: [SPY, QQQ, IWM, SPX, AAPL, MSFT, GOOG, AMZN, META, NVDA, TSLA]
      slots:
        stock-eod:
          cron: "30 21 * * *"
          priority: 5
        eod-pipeline:
          cron: "0 22 * * *"
          priority: 5
        universe-daily:
          cron: "0 22 * * *"
          priority: 3
        corporate:
          cron: "0 23 * * *"
          priority: 2
        option-refresh:
          cron: "20 */6 * * *"
          priority: 4
          batch_size: 12
        option-bars:
          cron: "45 22 * * *"
          priority: 4
          expiry_days: 60
          max_per_underlying: 40
        option-trades:
          cron: "0 23 * * *"
          priority: 3
          expiry_days: 60
          # 2 = smoke/entitlement-safe; raise after Polygon Options Trades entitlement is confirmed
          max_per_underlying: 2
          universe_limit: 50
        minute-bars:
          cron: "15 23 * * *"
          priority: 3
          expiry_days: 45
          max_per_underlying: 10
          batch_size: 80
        calendar:
          cron: "0 22 * * *"
          priority: 1
        reference:
          cron: "30 21 * * *"
          priority: 2
        fundamentals-rotate:
          cron: "0 3 * * *"
          priority: 1
          universe: cs
          prioritize_missing: true
          batch_size: 5000
          include_ratios: false
          include_short_interest: false
          include_short_volume: false
        related-rotate:
          cron: "30 22 * * *"
          priority: 1
          batch_size: 40
        trim:
          cron: "15 2 * * *"
          keep_days: 7
          keep_max: 5000
          option_trades_keep_days: 30
        stock-snapshot:
          cron: "5 21 * * *"
          priority: 4
        stock-movers:
          cron: "10 21 * * *"
          priority: 4
        oi-gap-heal:
          cron: "0 4 * * 6"
          lookback_days: 30
        # Wave 2.1: max-pain / atm-iv-pcr / iv-percentile moved to Research NS
        # (bifrost_research.scheduler.volatility). Plugin CronJobs deleted.
        readiness-refresh:
          cron: "30 23 * * *"
          priority: 0
