apiVersion: v1
kind: ConfigMap
metadata:
  name: market-data-schedule
  namespace: plugin-market-data
  labels:
    app.kubernetes.io/name: market-data
data:
  # This is the runtime copy. `config/schedule.yaml` in the repo holds the same
  # block for local runs and tests; the two are edited together, and a drift
  # between them is a slot behaving differently in the cluster than it reads.
  schedule.yaml: |
    scheduler:
      platform_api_url: http://platform-api.bifrost-platform-prod.svc.cluster.local:8780
      # IV Radar / SEPA benchmark universe: ETFs + SPX + M7 mega-caps.
      # eod-pipeline / option_snapshot / option_open_interest / atm-iv-pcr /
      # iv-percentile all union this with the watchlist.
      iv_radar_benchmarks: [SPY, QQQ, IWM, SPX, AAPL, MSFT, GOOG, AMZN, META, NVDA, TSLA]
      slots:
        stock-eod:
          # Align with Dagster market_universe_calendar @ 22:00 UTC (~17:00 America/Chicago).
          cron: "0 22 * * *"
          priority: 5
        eod-pipeline:
          cron: "0 22 * * *"
          priority: 5
          # Blueprint C-F5: snapshot research.option_universe. Resident names whole;
          # core and edge get the near-the-money window (next `expiries` expiries,
          # strikes within ±strike_pct of spot). Measured 2026-09-27 at 253 bytes a
          # row: the 640 core and edge chains whole are 672,930 contracts a session,
          # 15.3 GB over 90 sessions; the window is 141,934, 3.2 GB.
          universe: research
          expiries: 3
          strike_pct: 0.15
          # The bound is the later of the `expiries`-th expiry and the first one
          # `min_days` out, because counting expiries buys a different depth for
          # every name: measured 2026-09-25, the third listed expiry is +5 days
          # for AMD, AVGO and GOOGL and +84 days for CDW, AJG, KNX, THC and
          # VRSN. The three weekly names had held nothing at 7-90 DTE since
          # 08-28 and so had no IV30 at all. Sixty days is what Research asked
          # for: IV30 needs a quote either side of thirty. Monthly names do not
          # move (their third is already past the floor); weekly names go from 3
          # expiries to 10-12, which on this slot is one job per underlying
          # either way — 662 in the 30-hour window measured that day — and
          # roughly doubles the table.
          min_days: 60
          # ±strike_pct buys a different number of strikes for every ladder, the
          # same defect as counting expiries: strikes 5 apart on a 60 stock, or 2.5
          # apart on a 13 one, leave two to four in ±15% (XEL, CMS, NI, FTI, CNH), and
          # on 09-25 49 of 631 windowed names held fewer than the ten IV points
          # Research fits a smile on and 20 more sat at ten or eleven -- the same
          # names session after session (2026-09-14..25). The band therefore
          # reaches at least this many listed strikes on each side of spot. Six
          # because a whole right can go dark: on 09-22 fourteen names had no IV on
          # any put, and twelve strikes of calls alone still clear ten points where
          # four a side would leave eight. Cost measured on 09-25: +9,230 contracts
          # a session (+6.5%), +0.21 GB at 90 sessions; 295 bands widen, every other
          # name keeps its ±15%.
          min_strikes_each_side: 6
        universe-daily:
          cron: "0 22 * * *"
          priority: 3
        corporate:
          cron: "0 23 * * *"
          priority: 2
          # Whole market by ex-date window, not per watchlist symbol.
          lookback_days: 7
          lookahead_days: 60
        option-refresh:
          cron: "20 */6 * * *"
          priority: 4
          # One full cycle a day: four six-hourly runs x 144 covers the ~564
          # non-benchmark names in the universe. It was 12, and because the
          # rotation hashed the target date all four runs took the same twelve,
          # so the catalogue came round about every 48 days. option-bars picks
          # its near-spot tickers out of that catalogue, so a stale one narrows
          # what gets priced.
          batch_size: 144
          # Blueprint C-F5: enumerate research.option_universe (resident / core /
          # edge), not the watchlist. Names the table lists but nothing has
          # enumerated go first, up to this many per run; the table's tier sets
          # the priority. Empty table → the watchlist, so the slot never stalls.
          universe: research
          max_new_per_run: 150
        option-bars:
          cron: "45 22 * * *"
          priority: 4
          # At-the-money: next 3 expiries × ±10 strikes per right, per underlying.
          expiries: 3
          strikes_each_side: 10
          # The floor, but only for the names the rank rule leaves outside Brent's
          # window. Research solves ATM IV from option_daily with Brent when a
          # session's vendor snapshot is judged degraded — 0.118.0 deletes the vendor
          # rows on purpose, so Brent is the only source left there, and it needs an
          # expiry at 5-90 DTE. Measured 2026-09-26 over the 678-name universe: 610
          # underlyings already have a usable Brent window, 68 do not, and the weekly
          # ones among those are the thirteen largest names in the market, empty on
          # 14 of 14 sessions.
          #
          # `shallow_dte` is the discriminator and it has to be small: the third
          # listed expiry is 4-5 days out for those names, 7 for MU, then nothing
          # until 14 (PLTR) and 84 (VRSN). At 7 it selects exactly those 14 and
          # nobody else, and the gap 7->14 means the threshold is not a knife-edge.
          #
          # Cost, computed with this same SQL rather than estimated: 80,374 ->
          # 86,130 jobs, +5,756 (+7.2%), so the drain moves about a minute and the
          # 00:45 self-heal and 02:30 Research gate are untouched. Applying the floor
          # to every weekly name instead measured 156,798 (x1.95) and pushed the
          # drain to 00:10 UTC — 13x the cost for no extra protection, since those
          # names already have a Brent window.
          #
          # SPX is in the unprotected set and this cannot help it: with no
          # stock_daily close the near-spot spot join drops it. Index closes are a
          # separate decision.
          min_days: 60
          shallow_dte: 7
          # Renews the same 575 underlyings the P4 backfill bought history for;
          # the watchlist stays the fallback when research.option_universe is empty.
          universe: research
          # research.option_pinned_contract is always priced on top of the near-spot
          # window, and the first runs also buy each pinned contract's own history so
          # a closed leg has bars from before it drifted away from spot. Jobs dedup
          # on payload, so repeating the same window enqueues nothing.
          pinned_history_days: 400
        # option-trades retired 0.10.3: option trades are not in Options Starter.
        minute-bars:
          cron: "15 23 * * *"
          priority: 3
          expiries: 2
          strikes_each_side: 5
          # Option minute bars rotate through watchlist ∪ benchmarks (26 names since
          # 0.54.0, was the 18-name watchlist); 120 keeps each name's turn about as
          # frequent as 80 did over the smaller pool.
          batch_size: 120
          # 1-hour bars (only) for every other research-universe stock: Research settles
          # each forecast session hour by hour, and the watchlist carried these for 18 of
          # the 678 names it forecasts. Each name asks from the session after its newest
          # bar, or hourly_backfill_days back when it has none, so the first run fills
          # the history and a missed night is picked up by the next.
          hourly_universe: research
          hourly_backfill_days: 100
        calendar:
          cron: "0 22 * * *"
          priority: 1
        reference:
          cron: "30 21 * * *"
          priority: 2
        fundamentals-rotate:
          cron: "0 3 * * *"
          priority: 1
          universe: cs
          prioritize_missing: true
          batch_size: 5000
          include_ratios: false
          include_short_interest: false
          include_short_volume: false
        related-rotate:
          cron: "30 22 * * *"
          priority: 1
          batch_size: 40
        trim:
          cron: "15 2 * * *"
          # Retention is a window, so how far back the queue can be questioned
          # does not depend on how busy it was. Slot adherence looks back ~30h.
          keep_hours: 48
          # Backstop only, not a policy: a runaway producer must not grow the
          # table without bound between two trims.
          keep_max: 5000000
          # No gateway in front of the CLI Dagster fires; a backfill day can
          # leave millions of rows and one nightly run should clear them.
          budget_sec: 240
          # The job rows are a work queue, not a record. ops_jobs.queue_sample
          # keeps the throughput series once they are gone.
          queue_sample_keep_days: 90
          option_trades_keep_days: 30
          # One observation per session, so retention is counted in sessions.
          option_snapshot_keep_sessions: 90
          # Intraday rows leave at about 1,550 a second (the New York time-of-day has
          # to be evaluated per row); a session writes ~345,000 of them across its
          # three fires, so one nightly run needs about four minutes to keep up.
          snapshot_budget_sec: 300
          option_snapshot_intraday_keep_days: 30
        stock-snapshot:
          cron: "5 21 * * *"
          priority: 4
        stock-movers:
          cron: "10 21 * * *"
          priority: 4
        intraday-chain:
          # Dagster fires this three times a NY session (10:30 / 13:00 / 15:30 ET);
          # the cron here is the first fire, for dashboard display only.
          cron: "30 14 * * 1-5"
          priority: 3
        ticker-details:
          # /v3/reference/tickers/{ticker} only. The list endpoint does not carry
          # list_date / sector / market_cap / description, which is why they are
          # null for all 5,317 active tickers. 200 a day drains the backlog in about
          # four weeks and then keeps refreshing the stalest.
          cron: "30 3 * * *"
          priority: 1
          batch_size: 200
        treasury:
          # Twice, because the vendor's publication hour could not be measured.
          # Measured 2026-09-11: our newest was 2026-09-08 while Polygon already had
          # 09-09, so the 12:00 run had preceded its arrival — and `fetched_at` is a
          # last-write column (the 30-day lookback rewrites the whole window), so
          # when a row *first* became available is not recoverable from history.
          # A second late-day poll costs one page of twenty rows and removes the
          # need to guess the hour right.
          cron: "0 12,23 * * 1-5"
          priority: 2
          lookback_days: 30
        option-backfill:
          # Manual / one-off: 24 expiry months per underlying, strike within +-30%
          # of spot, at most 90 days of life priced per contract.
          # No cron: this is an Owner-run one-off, so the dashboard must not
          # score it for adherence. Fire it with POST /market/ingest/enqueue-slot.
          priority: 1
          months: 24
          # Per-row history from research.option_universe (12 for edge, 24 otherwise).
          universe: research
          strike_pct: 0.30
          dte: 90
        option-depth:
          # option-backfill's rule, for the names short of their tier's depth and
          # only the months they are short (0.56.0). Sunday 07:30 UTC: the queue is
          # idle and it is far from the 21:05-23:15 collection window. Dagster
          # fires it (bifrost-research market_option_depth_schedule).
          cron: "30 7 * * 0"
          priority: 1
          months: 24
          universe: research
          strike_pct: 0.30
          dte: 90
          # A name counts as at depth when its oldest bar is within this many days
          # of the target: the vendor's two-year window rolls daily and retention
          # truncates to a month start.
          grace_days: 30
        filings-backfill:
          # Manual / one-off: two years of 8-K text, the vendor's 8-K classification
          # and 10-K risk-factor / MD&A sections for every universe name. The daily
          # window in fundamentals-market only sees new filings.
          # No cron: Owner-run, so the dashboard must not score it for adherence.
          priority: 1
          days: 730
        corporate-backfill:
          # Manual / one-off: the full dividend and split history of every symbol in
          # research.option_universe union the watchlist. The daily `corporate` slot
          # walks a -7/+60 day window of the whole market, which never reaches back,
          # so a screen on dividend history had nothing to read.
          # No cron: Owner-run, so the dashboard must not score it for adherence.
          priority: 1
        option-contract-expired:
          # Manual / one-off: contracts that have already expired, which the live
          # catalogue enumeration drops the day they do. Walked a quarter at a time
          # per underlying so a page cap cannot truncate a decade into a month.
          # Scope: research.option_universe union pinned underlyings union watchlist.
          priority: 1
          months: 24
          months_per_batch: 3
          universe: research
        fundamentals-market:
          # Ratios + short volume for the last completed session, short interest
          # for the latest settlement; whole market at 1,000 rows a page.
          cron: "30 4 * * 2-6"
          priority: 2
          short_interest_lookback_days: 45
          # 120 pages truncated the 2026-09-09 pull mid-market and the job
          # correctly failed; short_interest then fell 27 days behind.
          short_interest_max_pages: 400
          # SEC filings for the universe (0.37.0): a four-day filing-date window
          # each run, plus up to 25 universe names with no filings yet backfilled.
          filings_lookback_days: 4
          filings_days: 730
          filings_catch_up: 25
        ratios-market:
          # Ratios alone, whole market, every day. The endpoint ignores ?date and
          # answers with the vendor's latest. Measured on 2026-09-28 (one session): the
          # 04:30 Tue fundamentals-market run still got 09-25, the 05:10 run got 09-28
          # (4,680 rows), stable at 4,790 by 14:10. So hourly 05:10-08:10, then 11:10,
          # 14:10 and a 20:10 safety net. Six pages a pull. Off the 21:05-23:15
          # collection window and the 04:30 slot.
          # Dagster fires it (bifrost-research market_ratios_market_schedule).
          cron: "10 5-8,11,14,20 * * *"
          priority: 2
        # Wave 2.1: max-pain / atm-iv-pcr / iv-percentile moved to Research NS
        # (bifrost_research.scheduler.volatility). Plugin CronJobs deleted.
        # Wave 14G-A: readiness-refresh slot + CronJob retired (stock_readiness_daily gone).
