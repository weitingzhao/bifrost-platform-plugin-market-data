apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data-api
  labels:
    app.kubernetes.io/name: market-data-api
    bifrost.market-data/role: api
  annotations:
    bifrost.dev/session: "true"
    bifrost.dev/session-name: market-data-api
    bifrost.dev/session-label: Market Data API
    bifrost.dev/session-group: market-data
spec:
  replicas: 1
  # Rolled, not recreated: Recreate left /api/plugin/market-data with no pod on every
  # release, and each Trade gateway answered 503. The API is stateless and its queue
  # sampler upserts on (sample_ts, kind), so two pods side by side for a few seconds
  # write the same row. The workers carry the singleton work, not this Deployment.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: market-data-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market-data-api
        bifrost.market-data/role: api
        app.kubernetes.io/part-of: bifrost-market-data
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: bifrost-market-data:0.2.0
          imagePullPolicy: IfNotPresent
          # Override image CMD (default: run_worker.py). scripts/run_api.py is in the image.
          args: ["python", "scripts/run_api.py"]
          env:
            - name: MARKET_DATA_CONFIG
              value: /config/market-data.yaml
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8790"
            - name: POLYGON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: market-data-secrets
                  key: polygon-api-key
                  optional: true
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: market-data-secrets
                  key: postgres-host
                  optional: true
            # D6 (2026-10-04): the login, next to its password, so a switch or a
            # rollback is one Secret patch. Absent key -> the ConfigMap's postgres.user.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: market-data-secrets
                  key: postgres-user
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: market-data-secrets
                  key: postgres-password
                  optional: true
            - name: MARKET_DATA_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: market-data-secrets
                  key: write-token
                  optional: true
          ports:
            - name: http
              containerPort: 8790
          volumeMounts:
            - name: config
              mountPath: /config/market-data.yaml
              subPath: market-data.yaml
              readOnly: true
            - name: schedule
              mountPath: /config/schedule.yaml
              subPath: schedule.yaml
              readOnly: true
            # Archive before delete (phase 0 W3): the nightly trim writes rows past
            # the window here as Parquet before it deletes them. NAS k3s-cold via
            # the nfs-cold StorageClass. The trim refuses to delete unless this is
            # a mount point.
            - name: archive
              mountPath: /archive
          resources:
            requests:
              cpu: 50m
              # Steady state sits near 154Mi once the four background caches
              # (inventory / dimensions / quality-score / chain-headline) are warm.
              memory: 256Mi
            limits:
              cpu: 500m
              # 256Mi OOMKilled the pod on 2026-09-11 02:29 during a cold cache
              # warm-up; the dimensions compute walks 19 datasets x 4 axes.
              # 768Mi from 0.77.0: the trim's archive pass imports pyarrow and
              # holds 50,000-row batches.
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: config
          configMap:
            name: market-data-config
        - name: schedule
          configMap:
            name: market-data-schedule
        - name: archive
          persistentVolumeClaim:
            claimName: market-data-archive
