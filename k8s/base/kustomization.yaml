apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: plugin-market-data

resources:
  - namespace.yaml
  - deployment-stocks.yaml
  - deployment-options.yaml
  - service.yaml
  - configmap.yaml
  - configmap-schedule.yaml
  - network-policy.yaml
  - pdb.yaml
  - cronjob-daily.yaml
  - cronjob-option-bars.yaml
  - cronjob-options-refresh.yaml
  - cronjob-reference.yaml
  - cronjob-readiness-refresh.yaml
  - cronjob-maintenance.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: bifrost
      app.kubernetes.io/component: market-data
    includeSelectors: false

images:
  - name: bifrost-market-data
    newTag: "0.1.2"
