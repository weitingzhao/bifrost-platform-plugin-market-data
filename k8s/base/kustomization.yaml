apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: plugin-market-data

resources:
  - namespace.yaml
  - deployment-stocks.yaml
  - deployment-options.yaml
  - deployment-api.yaml
  - deployment-polygon-ws.yaml
  - service.yaml
  - service-api.yaml
  - configmap.yaml
  - configmap-schedule.yaml
  - network-policy.yaml
  - pdb.yaml
  - cronjob-daily.yaml
  - cronjob-option-bars.yaml
  - cronjob-option-trades.yaml
  - cronjob-options-refresh.yaml
  - cronjob-reference.yaml
  - cronjob-maintenance.yaml
  - job-wave8-schema-migrate.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: bifrost
      app.kubernetes.io/component: market-data
    includeSelectors: false

images:
  - name: bifrost-market-data
    newName: 192.168.10.73:30500/bifrost-market-data
    newTag: "0.9.3"
