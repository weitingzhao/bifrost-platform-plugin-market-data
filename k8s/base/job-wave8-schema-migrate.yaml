# One-shot Wave 8 Golden Source migration (financials split + OI partition).
# apply_ddl in init_schema.py is idempotent — safe to re-run after deploy.
apiVersion: batch/v1
kind: Job
metadata:
  name: job-wave8-schema-migrate
  namespace: plugin-market-data
  labels:
    app.kubernetes.io/name: market-data
    app.kubernetes.io/component: schema-migrate
    bifrost.io/wave: "8"
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market-data
        app.kubernetes.io/component: schema-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: 192.168.10.73:30500/bifrost-market-data:0.9.0
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/init_schema.py"]
          envFrom:
            - secretRef:
                name: market-data-secrets
            - configMapRef:
                name: market-data-config
      serviceAccountName: default
