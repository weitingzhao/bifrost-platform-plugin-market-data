# One-shot Wave 8 verify (--wave8-only; no full apply_ddl — bifrost role lacks raw_market owner).
# Fresh Golden Source bootstrap: kubectl exec postgres pod + full init_schema or superuser apply_ddl.
# Re-run: kubectl delete job job-wave8-schema-migrate -n plugin-market-data --ignore-not-found
#         kubectl apply -f k8s/base/job-wave8-schema-migrate.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: job-wave8-schema-migrate
  namespace: plugin-market-data
  labels:
    app.kubernetes.io/name: market-data
    app.kubernetes.io/component: schema-migrate
    bifrost.io/wave: "8"
spec:
  # Short enough that a redeploy finds a clean slate. A Job's pod template is
  # immutable, so once this stopped being pinned to 0.11.1 and started
  # tracking the release tag, a second apply inside the TTL failed the whole
  # kustomization. Ten minutes is long enough to read the log after a deploy,
  # and re-running idempotent migrations on each release is the point.
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market-data
        app.kubernetes.io/component: schema-migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-pg
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 60); do
                if nc -z -w 2 bifrost-postgres-rw.data.svc.cluster.local 5432; then
                  echo ready; exit 0
                fi
                echo "wait $i"; sleep 2
              done
              exit 1
      containers:
        - name: migrate
          # Bare name so kustomize's image transformer rewrites it, the way
          # every other manifest here is written. Spelling the registry out
          # made the transformer skip this Job: it stayed on 0.11.1 from
          # 0.11.1 onward, and its 2026-09-10 log still listed the ops_jobs
          # tables as of that release — queue_sample, added in 0.20.x, absent.
          image: bifrost-market-data:0.1.0
          imagePullPolicy: Always
          command: ["python", "scripts/init_schema.py", "--wave8-only"]
          env:
            - name: MARKET_DATA_CONFIG
              value: /config/market-data.yaml
            - name: POLYGON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: market-data-secrets
                  key: polygon-api-key
                  optional: true
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: market-data-secrets
                  key: postgres-host
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: market-data-secrets
                  key: postgres-password
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /config/market-data.yaml
              subPath: market-data.yaml
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: market-data-config
      serviceAccountName: default
