# Market-data workers — egress to data NS (Postgres/Redis) + Polygon HTTPS + DNS
# + platform-api (watchlist union).
# Ingress is not restricted — K8s API proxy (platform-api uses kube-apiserver
# service proxy) originates from node IPs, not from a namespace, so
# namespace-scoped ingress rules block it. Keep egress-only.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: market-data-egress
  labels:
    app.kubernetes.io/name: market-data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: bifrost-market-data
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bifrost-platform-prod
      ports:
        - protocol: TCP
          port: 8780
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
