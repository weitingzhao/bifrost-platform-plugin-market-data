apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: plugin-market-data

resources:
  - namespace.yaml
  - job-wave8-schema-migrate.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: bifrost
      app.kubernetes.io/component: market-data
